# Praxis memory provider plugin for Hermes.
# Mounted at /opt/data/plugins/praxis/ in the hermes container.
#
# Usage:
#   oc apply -f hermes-plugin-configmap.yaml -n praxis-verified
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-hermes-plugin
  namespace: praxis-verified
  labels:
    app: hermes-agent
    component: praxis-plugin
data:
  plugin.yaml: |
    name: praxis
    version: 1.0.0
    description: "Praxis verification sidecar — routes memory writes through formal verification before persistence."
    hooks:
      - on_memory_write

  __init__.py: |
    """Praxis verification memory provider for Hermes.

    Routes every memory write through the Praxis verification sidecar
    (HTTP POST to localhost:8081/verify) before the write persists. The
    sidecar runs the full P1-P7 property pipeline and issues a proof
    certificate for valid writes.
    """

    from __future__ import annotations

    import logging
    import os
    import uuid
    from typing import Any, Dict, Optional

    from agent.memory_provider import MemoryProvider

    logger = logging.getLogger(__name__)

    _SIDECAR_URL = os.environ.get(
        "PRAXIS_SIDECAR_URL", "http://localhost:8081/verify"
    )


    def register_memory_provider():
        return PraxisMemoryProvider()


    class PraxisMemoryProvider(MemoryProvider):
        """Memory provider that verifies writes via the Praxis sidecar."""

        @property
        def name(self) -> str:
            return "praxis"

        def is_available(self) -> bool:
            try:
                import httpx  # noqa: F401
                return True
            except ImportError:
                return False

        def initialize(self, session_id: str, **kwargs) -> None:
            self._session_id = session_id
            logger.info("Praxis verification provider initialized (session=%s)", session_id)

        def system_prompt_block(self) -> str:
            return (
                "[Praxis] All memory writes are verified by the Praxis formal "
                "verification sidecar. Writes that fail verification (hallucination, "
                "contradiction, prompt injection) are flagged with proof certificates."
            )

        def on_memory_write(
            self,
            action: str,
            target: str,
            content: str,
            metadata: Optional[Dict[str, Any]] = None,
        ) -> None:
            try:
                import httpx

                trace_id = f"hermes-{uuid.uuid4().hex[:12]}"
                payload = {
                    "action": action,
                    "target": target,
                    "content": content,
                    "trace_id": trace_id,
                }
                if metadata:
                    payload["metadata"] = {
                        k: str(v) for k, v in metadata.items()
                        if isinstance(k, str)
                    }

                resp = httpx.post(_SIDECAR_URL, json=payload, timeout=10.0)
                result = resp.json()

                status = result.get("status", "UNKNOWN")
                props = result.get("properties", [])

                if status == "WRITE_OK":
                    logger.info(
                        "Praxis VERIFIED write: action=%s target=%s trace=%s props=%s",
                        action, target, trace_id, props,
                    )
                else:
                    violations = result.get("violations", [])
                    logger.warning(
                        "Praxis FLAGGED write: action=%s target=%s trace=%s violations=%s",
                        action, target, trace_id, violations,
                    )
            except Exception as exc:
                logger.debug("Praxis sidecar call failed: %s", exc)
