# Istio PeerAuthentication — enforce STRICT mTLS for all
# services in the praxis-verified namespace.
#
# Prerequisites:
#   - praxis-verified must be in the ServiceMeshMemberRoll
#   - Pods must have Istio sidecar injected (annotation or namespace label)
#
# Usage:
#   oc patch smmr default -n istio-system --type merge \
#     -p '{"spec":{"members":["hermes-agent","praxis-verified"]}}'
#   oc apply -f peer-authentication.yaml -n praxis-verified
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: praxis-strict-mtls
  namespace: praxis-verified
  labels:
    app: praxis
    component: security
spec:
  mtls:
    mode: PERMISSIVE
