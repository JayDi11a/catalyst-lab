apiVersion: v1
kind: Service
metadata:
  name: praxis-gateway
  namespace: praxis-verified
  labels:
    app: praxis-gateway
    component: verification
spec:
  type: ClusterIP
  selector:
    app: praxis-gateway
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
