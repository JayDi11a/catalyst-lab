apiVersion: batch/v1
kind: Job
metadata:
  name: golem-direct-ingest-expanded
  namespace: catalystlab-shared
  labels:
    app: project-golem
    component: direct-ingest-expanded
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: project-golem
        component: direct-ingest-expanded
    spec:
      restartPolicy: OnFailure
      containers:
      - name: direct-ingester
        image: quay.io/aicatalyst/project-golem:latest
        imagePullPolicy: Always
        command: ["python", "direct_ingest_expanded.py"]
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: golem-db-secret
              key: password
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: config
        configMap:
          name: golem-config
